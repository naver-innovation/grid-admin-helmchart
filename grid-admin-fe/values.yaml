appName: grid-admin-web
nameSuffix: real
forReal: true

timezone: Asia/Riyadh
lang: en_US.UTF-8

replicas: 1

deployment:
  minReadySeconds: 10
  terminationGracePeriodSeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

pdb:
  enabled: true
  minAvailable: 1

probes:
  startup:
    httpGet:
      path: /
      port: service
    failureThreshold: 12
    periodSeconds: 10
  readiness:
    httpGet:
      path: /
      port: service
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    httpGet:
      path: /
      port: service
    periodSeconds: 15
    failureThreshold: 3

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

registryHost: me-riyadh-1.ocir.io
registryProjectName: axlo4g31gl45

# Node.js server settings
spring:
  image:
    name: grid-admin-web
    tag: develop
    pullPolicy: Always
  containerPort: 80
  service:
    port: 80
    type: LoadBalancer
  nodeEnv: production
  pinpointEnabled: true
  pinpointSampleRate: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

sidecar:
  name: wasl-proxy-sidecar
  image: me-riyadh-1.ocir.io/axlo4g31gl45/wasl-sidecar-proxy:260114-1913

imagePullSecrets: "mapservice-ocir-read"

nodeSelector:
  kubernetes.io/arch: amd64

ncc:
  application: grid-admin-web
  instance: grid-admin-web
  version: 1
  installation: 2026-0101-0001
