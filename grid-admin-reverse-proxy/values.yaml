appName: grid-admin-reverse-proxy
nameSuffix: real
forReal: true

timezone: Asia/Riyadh
lang: en_US.UTF-8

replicas: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

startupProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  failureThreshold: 12
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 3

registryHost: me-riyadh-1.ocir.io
registryProjectName: axlo4g31gl45

spring:
  image:
    name: grid-admin-reverse-proxy-prod
    tag: main
    pullPolicy: Always
  profile: prod
  containerPort: 8080
  service:
    port: 80
    type: LoadBalancer
  pinpointEnabled: true
  pinpointSampleRate: 1
  javaOpts: "-Dreactor.netty.http.server.accessLogEnabled=true"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

gateway:
  backendUri: "http://grid-admin-api-mapservice.svc-ruh-1.naver-innovation.net/"
  frontendUri: "http://grid-admin-web-mapservice.svc-ruh-1.naver-innovation.net/"
  signatureEnabled: "true"
  hostSecurityKey: "<GATEWAY_HOST_SECURITY_KEY>"
  insecureTls: "true"

logging:
  ociLogOcid: "ocid1__log__oc1__me-riyadh-1__amaaaaaavimdcvyaexjey6vdqrbc5qbahfujg5ahibxkct7zorbdrppwwwfq"

mek:
  name: "ruh-prod-mapservice-mek-grid-admin"
  ocid: "ocid1.key.oc1.me-riyadh-1.tnu4jabvaah4.abqwuljrlztaihle5nn44ieyvmrfuizdvdxhdccouq753nyc6kj2zx6ysevq"

sidecar:
  name: wasl-proxy-sidecar
  image: me-riyadh-1.ocir.io/axlo4g31gl45/wasl-sidecar-proxy:260114-1913

imagePullSecrets: "mapservice-ocir-read"

nodeSelector:
  kubernetes.io/arch: amd64

ncc:
  application: grid-admin-reverse-proxy
  instance: grid-admin-reverse-proxy
  version: 1
  installation: 2026-0101-0001
